<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>JWord Vanilla Demo</title>
  </head>
  <body>
    <main class="jw-demo">
      <section class="jw-demo__workspace" aria-label="JWord vanilla demo workspace">
        <section class="jw-demo__toolbar-zone" aria-label="JWord official toolbar area">
          <div id="jword-toolbar"></div>
        </section>
        <section
          id="jword-demo-controls"
          class="jw-demo__demo-controls"
          aria-label="JWord demo controls area"
        >
          <button
            type="button"
            class="jw-demo__demo-button jw-demo__demo-button--accent"
            data-jword-load-alpha="true"
          >
            加载 Alpha 样例
          </button>
          <button type="button" class="jw-demo__demo-button" data-jword-restore-gate2="true">
            恢复 Gate 2 夹具
          </button>
          <button
            type="button"
            class="jw-demo__demo-button jw-demo__demo-button--primary"
            data-jword-select-sample="true"
          >
            选择首页片段
          </button>
          <button type="button" class="jw-demo__demo-button" data-jword-clear-selection="true">
            清除选区
          </button>
        </section>
        <section class="jw-demo__editor-shell" aria-label="JWord editor area">
          <div id="jword-editor" class="jw-demo__editor-host" aria-label="JWord editor canvas host"></div>
        </section>
        <section class="jw-demo__assistive-zone" aria-label="JWord assistive and status area">
          <p id="jword-status" class="jw-demo__status" aria-live="polite">Mounting editor...</p>
          <div id="jword-assistive-mirror"></div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
